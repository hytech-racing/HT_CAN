name: Generate and Release

on:
  push:
    branches:
      - '**'
  release:
    types: [prereleased, published]

jobs:
  generate-dbc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install cantools
        run: python -m pip install cantools==40.2.2

      - name: Convert JSON to DBC
        env:
          RELEASE_NUMBER: ${{ github.run_number }}
        run: |
          python conversion_scripts/json_to_dbc.py

      - name: Merge imported DBCs into release DBC
        run: |
          mkdir -p merged
          python conversion_scripts/merge_dbcs.py ht_can.dbc imported_dbcs/*.dbc -o merged/ht_can.dbc
          mv merged/ht_can.dbc ht_can.dbc

      - name: Upload dbc artifact
        uses: actions/upload-artifact@v7
        with:
          name: dbcfile
          path: ht_can.dbc
  generate-proto:
    needs: generate-dbc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install cantools
        run: python -m pip install cantools==40.2.2

      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: dbcfile
          path: ./dbc

      - name: Convert DBC to PROTO
        run: |
          python conversion_scripts/dbc_to_proto.py dbc/ ht_can.proto

      - name: Set up Protobuf tools and generate HTML file
        run: |
          mkdir -p docs
          mkdir -p proto/nanopb/google/protobuf
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends protobuf-compiler
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          export PATH=$PATH:$HOME/go/bin

          curl -fsSL -o proto/nanopb/google/protobuf/descriptor.proto https://raw.githubusercontent.com/nanopb/nanopb/nanopb-0.4.9.1/generator/proto/google/protobuf/descriptor.proto
          curl -fsSL -o proto/nanopb/nanopb.proto https://raw.githubusercontent.com/nanopb/nanopb/nanopb-0.4.9.1/generator/proto/nanopb.proto
          protoc -I=./. -I=proto/nanopb --doc_out=./docs --doc_opt=html,Release-${{github.run_number}}.html ht_can.proto

      - name: Upload html artifact
        uses: actions/upload-artifact@v7
        with:
          name: htmlfile
          path: ./docs/Release-${{github.run_number}}.html

      - name: Upload proto artifact
        uses: actions/upload-artifact@v7
        with:
          name: protofile
          path: ht_can.proto

      - name: Generate Python protobuf
        run: |
          mkdir -p python_can_lib
          protoc --python_out=python_can_lib ht_can.proto
          tar -czvf python_proto_lib.tar.gz python_can_lib

      - name: Upload python protobuf artifact
        uses: actions/upload-artifact@v7
        with:
          name: python_proto_lib
          path: python_proto_lib.tar.gz

  generate-and-release:
    needs: [generate-dbc, generate-proto]
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.release_name.outputs.name }}
    container:
      image: ghcr.io/rcmast3r/ccoderdbc:main
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set release name
        id: release_name
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "name=${SAFE_BRANCH}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Download dbc artifact
        uses: actions/download-artifact@v8
        with:
          name: dbcfile
          path: /dbc

      - name: Download proto artifact
        uses: actions/download-artifact@v8
        with:
          name: protofile
          path: .

      - name: generate code
        run: |
          mkdir -p /ht_can.can_lib
          cd /app
          ./build/coderdbc -rw -dbc /dbc/ht_can.dbc -out /ht_can.can_lib -drvname ht_can
          mkdir -p /output
          echo "{\n\"name\": \"can_lib\",\n\"version\": \"1.0.0\",\n\"build\": {\n\t\"flags\": [\n\t\t\"-Iinc\",\n\t\t\"-Ilib\",\n\t\t\"-Iconf\"\n\t]\n}\n}" >> /ht_can.can_lib/library.json
          tar -czvf /output/can_lib.tar.gz /ht_can.can_lib

      - name: generate drivebrain lib release
        run:  |
          mkdir -p /ht_can.drivebrain_lib/proto
          mkdir -p /ht_can.drivebrain_lib/dbc

          cp ht_can.proto /ht_can.drivebrain_lib/proto
          cp /dbc/ht_can.dbc /ht_can.drivebrain_lib/dbc/
          cp CMakeLists.txt /ht_can.drivebrain_lib
          tar -czvf /output/drivebrain_can_lib.tar.gz /ht_can.drivebrain_lib

      - name: Create Version Header
        run: |
          mkdir -p /ht_can.can_lib/inc
          cat << EOF > /ht_can.can_lib/inc/ht_can_version.h
          /**
           * @file ht_can_version.h
           * @brief Auto-generated version header for ht_can.CAN Library
           * @details Generated by GitHub Actions (CI/CD) - Do not modify manually
           */

          #ifndef HT_CAN_VERSION_H
          #define HT_CAN_VERSION_H

          /**
           * @brief Version number of the ht_can.CAN Library
           * @details This is automatically updated with each GitHub Actions run
           */
          #define HT_CAN_VERSION ${{ github.run_number }}

          #endif /* HT_CAN_VERSION_H */
          EOF

          # Also update the tar archive to include the new file
          tar -czvf /output/can_lib.tar.gz /ht_can.can_lib

      - name: Download html artifact
        uses: actions/download-artifact@v8
        with:
          name: htmlfile
          path: /docs

      - name: Download python protobuf artifact
        uses: actions/download-artifact@v8
        with:
          name: python_proto_lib
          path: /output

      # Creates the release and uploads every asset in one step. Asset names are the file names,
      # so download URLs (e.g. releases/download/<tag>/can_lib.tar.gz) are unchanged.
      - name: Create release and upload assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_name.outputs.name }}
          name: Release-${{ steps.release_name.outputs.name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            /output/can_lib.tar.gz
            /output/drivebrain_can_lib.tar.gz
            /dbc/ht_can.dbc
            ht_can.proto
            /docs/Release-${{ github.run_number }}.html
            /output/python_proto_lib.tar.gz

  publish-conan:
    needs: [generate-proto, generate-and-release]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Download proto artifact
        uses: actions/download-artifact@v8
        with:
          name: protofile
          path: proto

      - name: Install Conan
        run: |
          python -m pip install conan==2.31.2
          conan profile detect --force

      - name: Build and upload Conan package
        env:
          ARTIFACTORY_TOKEN: ${{ secrets.ARTIFACTORY_TOKEN }}
          ARTIFACTORY_URL: ${{ secrets.ARTIFACTORY_URL }}
          ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
        run: |
        
          if [ "${{ github.event_name }}" = "release" ]; then
            VERSION="${{ github.event.release.tag_name }}"
          else
            VERSION="${{ needs.generate-and-release.outputs.release_name }}"
          fi
          VERSION=$(echo "$VERSION" | tr '[:upper:]' '[:lower:]')      
          conan remote add artifactory "$ARTIFACTORY_URL" --force
          conan remote login artifactory "$ARTIFACTORY_USERNAME" --password "$ARTIFACTORY_TOKEN"
          conan create . --build=missing --version="$VERSION"
          conan upload "ht_can/$VERSION" -r artifactory --confirm

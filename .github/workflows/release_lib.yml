name: Generate and Release

on:
  push:
    branches:
      - '**'

jobs:
  generate-dbc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install cantools
        run: python -m pip install cantools==40.2.2

      - name: Convert JSON to DBC
        run: |
          cat << 'EOF' > build_dbc.py
          import json, cantools
          from cantools.database import can
          from cantools.database.conversion import BaseConversion
          
          # Load Enums and convert JSON string keys to integer keys for cantools
          with open('json_lib/enums.json', 'r') as f:
              raw_enums = json.load(f)
              global_enums = {
                  name: {int(k): v for k, v in choices.items()}
                  for name, choices in raw_enums.items()
              }
              
          with open('json_lib/signals.json', 'r') as f:
              global_signals = json.load(f)
              
          with open('json_lib/messages.json', 'r') as f:
              messages_data = json.load(f)
          
          db_messages = []
          for msg in messages_data:
              msg_signals = []
              for sig_ref in msg['signals']:
                  sig_prop = global_signals[sig_ref['name']]
                  
                  # Generate the conversion object for scale and offset
                  conv = BaseConversion.factory(
                      scale=sig_prop.get('scale', 1.0),
                      offset=sig_prop.get('offset', 0.0),
                      is_float=sig_prop.get('is_float', False)
                  )
                  
                  # Fetch enum choices if the signal references one
                  enum_ref = sig_prop.get('enum')
                  choices = global_enums.get(enum_ref) if enum_ref else None
                  
                  msg_signals.append(can.Signal(
                      name=sig_ref['name'],
                      start=sig_ref['start_bit'],
                      length=sig_prop['length'],
                      byte_order='big_endian' if sig_prop.get('is_big_endian', False) else 'little_endian',
                      is_signed=sig_prop.get('is_signed', False),
                      conversion=conv,
                      minimum=sig_prop.get('min'),
                      maximum=sig_prop.get('max'),
                      unit=sig_prop.get('unit', ''),
                      choices=choices,
                      comment=sig_prop.get('description', '')
                  ))
              
              db_messages.append(can.Message(
                  frame_id=int(msg['id'], 16) if isinstance(msg['id'], str) else msg['id'],
                  name=msg['name'],
                  length=msg['dlc'],
                  is_extended_frame=msg.get('is_extended', False),
                  signals=msg_signals,
                  comment=msg.get('description', '')
              ))
          
          db = cantools.database.Database(messages=db_messages)
          cantools.database.dump_file(db, 'hytech.dbc')
          EOF
          python build_dbc.py

      - name: Upload dbc artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbcfile
          path: hytech.dbc
  generate-proto:
    needs: generate-dbc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install cantools
        run: python -m pip install cantools==40.2.2

      - name: Download artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: dbcfile
          path: ./dbc

      - name: Convert DBC to PROTO
        run: |
          python dbc_to_proto/dbc_to_proto.py dbc/ hytech.proto

      - name: Set up Protobuf tools and generate HTML file
        run: |
          mkdir -p docs
          mkdir -p proto/nanopb/google/protobuf

          sudo apt-get install -y --no-install-recommends protobuf-compiler
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          export PATH=$PATH:$HOME/go/bin

          curl -o proto/nanopb/google/protobuf/descriptor.proto https://raw.githubusercontent.com/nanopb/nanopb/nanopb-0.4.9.1/generator/proto/google/protobuf/descriptor.proto
          curl -o proto/nanopb/nanopb.proto https://raw.githubusercontent.com/nanopb/nanopb/nanopb-0.4.9.1/generator/proto/nanopb.proto
          protoc -I=./. -I=proto/nanopb --doc_out=./docs --doc_opt=html,Release-${{github.run_number}}.html hytech.proto

      - name: Upload html artifact
        uses: actions/upload-artifact@v4
        with:
          name: htmlfile
          path: ./docs/Release-${{github.run_number}}.html

      - name: Upload proto artifact
        uses: actions/upload-artifact@v4
        with:
          name: protofile
          path: hytech.proto

      - name: Generate Python protobuf
        run: |
          mkdir -p python_can_lib
          protoc --python_out=python_can_lib hytech.proto
          tar -czvf python_proto_lib.tar.gz python_can_lib

      - name: Upload python protobuf artifact
        uses: actions/upload-artifact@v4
        with:
          name: python_proto_lib
          path: python_proto_lib.tar.gz

  generate-and-release:
    needs: [generate-dbc, generate-proto]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rcmast3r/ccoderdbc:main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set release name
        id: release_name
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "name=${SAFE_BRANCH}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Download dbc artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: dbcfile
          path: /dbc

      - name: Download proto artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: protofile
          path: .

      - name: generate code
        run: |
          mkdir -p /hytech_can_lib
          cd /app
          ./build/coderdbc -rw -dbc /dbc/hytech.dbc -out /hytech_can_lib -drvname hytech
          mkdir -p /output
          echo "{\n\"name\": \"can_lib\",\n\"version\": \"1.0.0\",\n\"build\": {\n\t\"flags\": [\n\t\t\"-Iinc\",\n\t\t\"-Ilib\",\n\t\t\"-Iconf\"\n\t]\n}\n}" >> /hytech_can_lib/library.json
          tar -czvf /output/can_lib.tar.gz /hytech_can_lib

      - name: generate drivebrain lib release
        run:  |
          mkdir -p /hytech_drivebrain_lib/proto
          mkdir -p /hytech_drivebrain_lib/dbc

          cp hytech.proto /hytech_drivebrain_lib/proto
          cp /dbc/hytech.dbc /hytech_drivebrain_lib/dbc/
          cp CMakeLists.txt /hytech_drivebrain_lib
          tar -czvf /output/drivebrain_can_lib.tar.gz /hytech_drivebrain_lib

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_name.outputs.name }}
          release_name: Release-${{ steps.release_name.outputs.name }}
          draft: false
          prerelease: false

      - name: Create Version Header
        run: |
          mkdir -p /hytech_can_lib/inc
          cat << EOF > /hytech_can_lib/inc/ht_can_version.h
          /**
           * @file ht_can_version.h
           * @brief Auto-generated version header for HyTech CAN Library
           * @details Generated by GitHub Actions (CI/CD) - Do not modify manually
           */

          #ifndef HT_CAN_VERSION_H
          #define HT_CAN_VERSION_H

          /**
           * @brief Version number of the HyTech CAN Library
           * @details This is automatically updated with each GitHub Actions run
           */
          #define HT_CAN_LIB_VERSION ${{ github.run_number }}

          #endif /* HT_CAN_VERSION_H */
          EOF

          # Also update the tar archive to include the new file
          tar -czvf /output/can_lib.tar.gz /hytech_can_lib

      - name: Upload release asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /output/can_lib.tar.gz
          asset_name: can_lib.tar.gz
          asset_content_type: application/zip

      - name: Upload drivebrain release asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /output/drivebrain_can_lib.tar.gz
          asset_name: drivebrain_can_lib.tar.gz
          asset_content_type: application/zip

      - name: Upload hytech.dbc
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /dbc/hytech.dbc
          asset_name: hytech.dbc
          asset_content_type: text/plain

      - name: Upload hytech.proto
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: hytech.proto
          asset_name: hytech.proto
          asset_content_type: text/plain

      - name: Download html artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: htmlfile
          path: /docs

      - name: Upload html
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /docs/Release-${{ github.run_number }}.html
          asset_name: Release-${{ github.run_number }}.html
          asset_content_type: text/plain

      - name: Download python protobuf artifact
        uses: actions/download-artifact@v4
        with:
          name: python_proto_lib
          path: /output

      - name: Upload python protobuf release asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /output/python_proto_lib.tar.gz
          asset_name: python_proto_lib.tar.gz
          asset_content_type: application/zip

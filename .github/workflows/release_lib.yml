name: Generate and Release

on:
  push:
    branches:
      - '**'

jobs:
  generate-dbc:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install cantools
        run: python -m pip install cantools==40.2.2

      - name: Convert JSON to DBC
        run: |
          cat << 'EOF' > build_dbc.py
          import json, cantools
          from cantools.database import can
          from cantools.database.conversion import BaseConversion
          
          # Load Enums and convert JSON string keys to integer keys for cantools
          with open('json_lib/enums.json', 'r') as f:
              raw_enums = json.load(f)
              global_enums = {
                  name: {int(k): v for k, v in choices.items()}
                  for name, choices in raw_enums.items()
              }
              
          with open('json_lib/signals.json', 'r') as f:
              global_signals = json.load(f)
              
          with open('json_lib/messages.json', 'r') as f:
              messages_data = json.load(f)
          
          db_messages = []
          for msg in messages_data:
              msg_signals = []
              current_bit = 0
              max_bit = 0
              
              for sig_ref in msg['signals']:
                  sig_prop = global_signals[sig_ref['name']]
                  length = sig_prop['length']
                  
                  # Automatically calculate start bit sequentially if missing
                  if 'start_bit' in sig_ref:
                      pcan_start = sig_ref['start_bit']
                  else:
                      pcan_start = current_bit
                      
                  # Advance current_bit for the next signal and update max bounds
                  current_bit = pcan_start + length
                  if current_bit > max_bit:
                      max_bit = current_bit
                      
                  is_big_endian = sig_prop.get('is_big_endian', False)
                  is_signed = sig_prop.get('is_signed', False)
                  
                  # Convert PCAN LSB start bit to DBC MSB start bit for Big Endian signals
                  if is_big_endian:
                      dbc_start = min(
                          pcan_start + length - 1, 
                          (pcan_start // 8) * 8 + 7
                      )
                  else:
                      dbc_start = pcan_start
                  
                  # Fetch enum choices if the signal references one
                  enum_ref = sig_prop.get('enum')
                  choices = global_enums.get(enum_ref) if enum_ref else None
                  
                  # Strip .0 floats back to strict integers to prevent ccoderdbc from generating _ro conversions
                  scale_val = sig_prop.get('scale', 1)
                  offset_val = sig_prop.get('offset', 0)
                  
                  clean_scale = int(scale_val) if isinstance(scale_val, float) and scale_val.is_integer() else scale_val
                  clean_offset = int(offset_val) if isinstance(offset_val, float) and offset_val.is_integer() else offset_val
                  
                  # Calculate theoretical min/max bounds based on bit length
                  raw_min = -(2 ** (length - 1)) if is_signed else 0
                  raw_max = (2 ** (length - 1)) - 1 if is_signed else (2 ** length) - 1
                  
                  calc_min = (raw_min * clean_scale) + clean_offset
                  calc_max = (raw_max * clean_scale) + clean_offset
                  
                  # Use explicitly defined limits if they exist, otherwise use the calculated limits
                  final_min = sig_prop.get('min') if sig_prop.get('min') is not None else calc_min
                  final_max = sig_prop.get('max') if sig_prop.get('max') is not None else calc_max
                  
                  # Generate the conversion object for scale, offset, and choices
                  conv = BaseConversion.factory(
                      scale=clean_scale,
                      offset=clean_offset,
                      choices=choices,
                      is_float=sig_prop.get('is_float', False)
                  )
                  
                  msg_signals.append(can.Signal(
                      name=sig_ref['name'],
                      start=dbc_start,
                      length=length,
                      byte_order='big_endian' if is_big_endian else 'little_endian',
                      is_signed=is_signed,
                      conversion=conv,
                      minimum=final_min,
                      maximum=final_max,
                      unit=sig_prop.get('unit', ''),
                      comment=sig_prop.get('description', '')
                  ))
              
              # Automatically calculate DLC based on the highest bit used if missing
              if 'dlc' in msg:
                  calculated_dlc = msg['dlc']
              else:
                  calculated_dlc = (max_bit + 7) // 8
              
              db_messages.append(can.Message(
                  frame_id=int(msg['id'], 16) if isinstance(msg['id'], str) else msg['id'],
                  name=msg['name'],
                  length=calculated_dlc,
                  is_extended_frame=msg.get('is_extended', False),
                  senders=msg.get('senders', ['ECU']),
                  signals=msg_signals,
                  comment=msg.get('description', '')
              ))
          
          db = cantools.database.Database(messages=db_messages)
          cantools.database.dump_file(db, 'ht_can_lib.dbc')
          EOF
          python build_dbc.py

      - name: Upload dbc artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbcfile
          path: ht_can_lib.dbc
  generate-proto:
    needs: generate-dbc
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install cantools
        run: python -m pip install cantools==40.2.2

      - name: Download artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: dbcfile
          path: ./dbc

      - name: Convert DBC to PROTO
        run: |
          python dbc_to_proto/dbc_to_proto.py dbc/ ht_can_lib.proto

      - name: Set up Protobuf tools and generate HTML file
        run: |
          mkdir -p docs
          mkdir -p proto/nanopb/google/protobuf

          sudo apt-get install -y --no-install-recommends protobuf-compiler
          go install github.com/pseudomuto/protoc-gen-doc/cmd/protoc-gen-doc@v1.5.1
          export PATH=$PATH:$HOME/go/bin

          curl -o proto/nanopb/google/protobuf/descriptor.proto https://raw.githubusercontent.com/nanopb/nanopb/nanopb-0.4.9.1/generator/proto/google/protobuf/descriptor.proto
          curl -o proto/nanopb/nanopb.proto https://raw.githubusercontent.com/nanopb/nanopb/nanopb-0.4.9.1/generator/proto/nanopb.proto
          protoc -I=./. -I=proto/nanopb --doc_out=./docs --doc_opt=html,Release-${{github.run_number}}.html ht_can_lib.proto

      - name: Upload html artifact
        uses: actions/upload-artifact@v4
        with:
          name: htmlfile
          path: ./docs/Release-${{github.run_number}}.html

      - name: Upload proto artifact
        uses: actions/upload-artifact@v4
        with:
          name: protofile
          path: ht_can_lib.proto

      - name: Generate Python protobuf
        run: |
          mkdir -p python_can_lib
          protoc --python_out=python_can_lib ht_can_lib.proto
          tar -czvf python_proto_lib.tar.gz python_can_lib

      - name: Upload python protobuf artifact
        uses: actions/upload-artifact@v4
        with:
          name: python_proto_lib
          path: python_proto_lib.tar.gz

  generate-and-release:
    needs: [generate-dbc, generate-proto]
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/rcmast3r/ccoderdbc:main
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set release name
        id: release_name
        run: |
          SAFE_BRANCH=$(echo "${{ github.ref_name }}" | tr '/' '-')
          echo "name=${SAFE_BRANCH}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Download dbc artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: dbcfile
          path: /dbc

      - name: Download proto artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: protofile
          path: .

      - name: generate code
        run: |
          mkdir -p /ht_can_lib.can_lib
          cd /app
          ./build/coderdbc -rw -dbc /dbc/ht_can_lib.dbc -out /ht_can_lib.can_lib -drvname hytech
          mkdir -p /output
          echo "{\n\"name\": \"can_lib\",\n\"version\": \"1.0.0\",\n\"build\": {\n\t\"flags\": [\n\t\t\"-Iinc\",\n\t\t\"-Ilib\",\n\t\t\"-Iconf\"\n\t]\n}\n}" >> /ht_can_lib.can_lib/library.json
          tar -czvf /output/can_lib.tar.gz /ht_can_lib.can_lib

      - name: generate drivebrain lib release
        run:  |
          mkdir -p /ht_can_lib.drivebrain_lib/proto
          mkdir -p /ht_can_lib.drivebrain_lib/dbc

          cp ht_can_lib.proto /ht_can_lib.drivebrain_lib/proto
          cp /dbc/ht_can_lib.dbc /ht_can_lib.drivebrain_lib/dbc/
          cp CMakeLists.txt /ht_can_lib.drivebrain_lib
          tar -czvf /output/drivebrain_can_lib.tar.gz /ht_can_lib.drivebrain_lib

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.release_name.outputs.name }}
          release_name: Release-${{ steps.release_name.outputs.name }}
          draft: false
          prerelease: false

      - name: Create Version Header
        run: |
          mkdir -p /ht_can_lib.can_lib/inc
          cat << EOF > /ht_can_lib.can_lib/inc/ht_can_version.h
          /**
           * @file ht_can_version.h
           * @brief Auto-generated version header for ht_can_lib.CAN Library
           * @details Generated by GitHub Actions (CI/CD) - Do not modify manually
           */

          #ifndef HT_CAN_VERSION_H
          #define HT_CAN_VERSION_H

          /**
           * @brief Version number of the ht_can_lib.CAN Library
           * @details This is automatically updated with each GitHub Actions run
           */
          #define HT_CAN_LIB_VERSION ${{ github.run_number }}

          #endif /* HT_CAN_VERSION_H */
          EOF

          # Also update the tar archive to include the new file
          tar -czvf /output/can_lib.tar.gz /ht_can_lib.can_lib

      - name: Upload release asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /output/can_lib.tar.gz
          asset_name: can_lib.tar.gz
          asset_content_type: application/zip

      - name: Upload drivebrain release asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /output/drivebrain_can_lib.tar.gz
          asset_name: drivebrain_can_lib.tar.gz
          asset_content_type: application/zip

      - name: Upload ht_can_lib.dbc
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /dbc/ht_can_lib.dbc
          asset_name: ht_can_lib.dbc
          asset_content_type: text/plain

      - name: Upload ht_can_lib.proto
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ht_can_lib.proto
          asset_name: ht_can_lib.proto
          asset_content_type: text/plain

      - name: Download html artifact
        uses: actions/download-artifact@v4.1.8
        with:
          name: htmlfile
          path: /docs

      - name: Upload html
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /docs/Release-${{ github.run_number }}.html
          asset_name: Release-${{ github.run_number }}.html
          asset_content_type: text/plain

      - name: Download python protobuf artifact
        uses: actions/download-artifact@v4
        with:
          name: python_proto_lib
          path: /output

      - name: Upload python protobuf release asset
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: /output/python_proto_lib.tar.gz
          asset_name: python_proto_lib.tar.gz
          asset_content_type: application/zip
